<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>CRUD de Doações - ConectaDoa</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

<main class="wrap">

    <h1>ConectaDoa — CRUD de Doações</h1>

    <nav>
        <a href="/">Início</a>
        <a href="/doadores.html">Doadores</a>
        <a href="/instituicoes.html">Instituições</a>
    </nav>

    <div class="grid" style="margin-top: 20px">

        <section class="card">

            <h2 id="formTitle">
                Nova doação
            </h2>

            <form id="form">

                <input
                        type="hidden"
                        id="id"
                        name="id"
                >

                <label for="alimento">
                    Alimento
                </label>

                <input
                        id="alimento"
                        name="alimento"
                        type="text"
                        required
                >

                <label for="quantidade">
                    Quantidade
                </label>

                <input
                        id="quantidade"
                        name="quantidade"
                        type="number"
                        step="0.01"
                        min="0.01"
                        required
                >

                <label for="unidade">
                    Unidade
                </label>

                <input
                        id="unidade"
                        name="unidade"
                        type="text"
                        placeholder="kg, unidades..."
                        required
                >

                <label for="validade">
                    Validade
                </label>

                <input
                        id="validade"
                        name="validade"
                        type="date"
                        required
                >

                <label for="doadorId">
                    Doador
                </label>

                <select
                        id="doadorId"
                        name="doadorId"
                        required
                ></select>

                <button type="submit">
                    Salvar
                </button>

                <button
                        type="button"
                        id="btnCancelar"
                        class="secondary"
                >
                    Cancelar
                </button>

                <div
                        class="msg"
                        id="msg"
                        role="alert"
                        aria-live="polite"
                ></div>

            </form>

        </section>

        <section class="card">

            <h2>
                Doações cadastradas
            </h2>

            <label for="instituicaoId">
                Instituição que vai reservar
            </label>

            <select id="instituicaoId"></select>

            <div
                    id="lista"
                    aria-live="polite"
            >
                Carregando...
            </div>

        </section>

    </div>

</main>


<script src="api.js"></script>
<script>

    const API = "/api/doacoes";

    const form =
        document.getElementById("form");

    const campoId =
        document.getElementById("id");

    const campoAlimento =
        document.getElementById("alimento");

    const campoQuantidade =
        document.getElementById("quantidade");

    const campoUnidade =
        document.getElementById("unidade");

    const campoValidade =
        document.getElementById("validade");

    const campoDoador =
        document.getElementById("doadorId");

    const campoInstituicao =
        document.getElementById("instituicaoId");

    const tituloFormulario =
        document.getElementById("formTitle");

    const mensagem =
        document.getElementById("msg");

    const lista =
        document.getElementById("lista");

    const botaoCancelar =
        document.getElementById("btnCancelar");


    function limparFormulario() {

        form.reset();

        campoId.value = "";

        tituloFormulario.textContent =
            "Nova doação";

        mensagem.textContent = "";
    }


    function editarDoacao(doacao) {

        campoId.value =
            doacao.id;

        campoAlimento.value =
            doacao.alimento;

        campoQuantidade.value =
            doacao.quantidade;

        campoUnidade.value =
            doacao.unidade;

        campoValidade.value =
            doacao.validade;

        campoDoador.value =
            doacao.doadorId;

        tituloFormulario.textContent =
            "Editar doação";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    async function excluirDoacao(id) {

        const confirmou =
            window.confirm(
                "Deseja realmente excluir esta doação?"
            );

        if (!confirmou) {
            return;
        }

        try {

            const resposta =
                await fetch(
                    `${API}/${id}`,
                    {
                        method: "DELETE"
                    }
                );

            if (!resposta.ok) {

                throw new Error(
                    "Não foi possível excluir a doação."
                );
            }

            await listarDoacoes();

        } catch (erro) {

            console.error(erro);

            mensagem.textContent =
                "Erro ao excluir a doação.";
        }
    }


    async function mudarStatus(url, dados) {

        mensagem.textContent = "";

        try {

            await chamarApi(url, "PUT", dados);

            await listarDoacoes();

        } catch (erro) {

            mensagem.textContent =
                erro.message;
        }
    }


    function preencherSelect(select, itens, textoVazio) {

        select.replaceChildren();

        if (itens.length === 0) {

            select.add(new Option(textoVazio, ""));

            return;
        }

        for (const item of itens) {
            select.add(new Option(item.nome, item.id));
        }
    }


    async function carregarOpcoes() {

        preencherSelect(
            campoDoador,
            await chamarApi("/api/doadores"),
            "Cadastre um doador primeiro"
        );

        preencherSelect(
            campoInstituicao,
            await chamarApi("/api/instituicoes"),
            "Cadastre uma instituição primeiro"
        );
    }


    function criarItemDoacao(doacao) {

        const div =
            document.createElement("div");

        div.className =
            "item";


        const titulo =
            document.createElement("strong");

        titulo.textContent =
            doacao.alimento;


        const informacoes =
            document.createElement("p");

        informacoes.textContent =
            `${doacao.quantidade} ${doacao.unidade} — validade: ${doacao.validade}`;


        const doador =
            document.createElement("p");

        doador.textContent =
            `Doador: ${doacao.doadorNome} — ${doacao.doadorContato}`;


        const situacao =
            document.createElement("p");

        situacao.textContent =
            `Status: ${doacao.status}`;


        if (doacao.reserva) {

            situacao.textContent +=
                ` — ${doacao.reserva.instituicaoNome} (${doacao.reserva.instituicaoContato}), reservada em ${doacao.reserva.dataReserva}`;

            if (doacao.reserva.dataRetirada) {

                situacao.textContent +=
                    `, retirada em ${doacao.reserva.dataRetirada}`;
            }
        }


        const acoes =
            document.createElement("div");

        acoes.className =
            "actions";


        if (doacao.status === "DISPONIVEL") {

            const botaoReservar =
                document.createElement("button");

            botaoReservar.type =
                "button";

            botaoReservar.textContent =
                "Reservar";

            botaoReservar.addEventListener(
                "click",
                () => mudarStatus(
                    `${API}/${doacao.id}/reservar`,
                    { instituicaoId: campoInstituicao.value }
                )
            );

            acoes.appendChild(
                botaoReservar
            );
        }


        if (doacao.status === "RESERVADA") {

            const botaoRetirar =
                document.createElement("button");

            botaoRetirar.type =
                "button";

            botaoRetirar.textContent =
                "Registrar retirada";

            botaoRetirar.addEventListener(
                "click",
                () => mudarStatus(
                    `${API}/${doacao.id}/retirar`
                )
            );

            acoes.appendChild(
                botaoRetirar
            );
        }


        const botaoEditar =
            document.createElement("button");

        botaoEditar.type =
            "button";

        botaoEditar.textContent =
            "Editar";

        botaoEditar.addEventListener(
            "click",
            () => editarDoacao(doacao)
        );


        const botaoExcluir =
            document.createElement("button");

        botaoExcluir.type =
            "button";

        botaoExcluir.textContent =
            "Excluir";

        botaoExcluir.className =
            "danger";

        botaoExcluir.addEventListener(
            "click",
            async () => {
                await excluirDoacao(doacao.id);
            }
        );


        acoes.appendChild(
            botaoEditar
        );

        acoes.appendChild(
            botaoExcluir
        );


        div.appendChild(
            titulo
        );

        div.appendChild(
            informacoes
        );

        div.appendChild(
            doador
        );

        div.appendChild(
            situacao
        );

        div.appendChild(
            acoes
        );


        return div;
    }


    async function listarDoacoes() {

        lista.textContent =
            "Carregando...";

        try {

            const resposta =
                await fetch(API);

            if (!resposta.ok) {

                throw new Error(
                    "Erro ao buscar doações."
                );
            }

            const itens =
                await resposta.json();


            lista.replaceChildren();


            if (itens.length === 0) {

                const mensagemVazia =
                    document.createElement("p");

                mensagemVazia.textContent =
                    "Nenhuma doação cadastrada.";

                lista.appendChild(
                    mensagemVazia
                );

                return;
            }


            for (const item of itens) {

                const respostaDetalhes =
                    await fetch(
                        `${API}/${item.id}`
                    );

                if (!respostaDetalhes.ok) {
                    continue;
                }

                const doacao =
                    await respostaDetalhes.json();

                const elemento =
                    criarItemDoacao(doacao);

                lista.appendChild(
                    elemento
                );
            }

        } catch (erro) {

            console.error(erro);

            lista.textContent =
                "Não foi possível carregar as doações.";
        }
    }


    form.addEventListener(
        "submit",
        async (evento) => {

            evento.preventDefault();

            mensagem.textContent = "";


            const dados = {

                alimento:
                    campoAlimento.value,

                quantidade:
                    Number(
                        campoQuantidade.value
                    ),

                unidade:
                    campoUnidade.value,

                validade:
                    campoValidade.value,

                doadorId:
                    campoDoador.value
            };


            const id =
                campoId.value;


            const url =
                id
                    ? `${API}/${id}`
                    : API;


            const metodo =
                id
                    ? "PUT"
                    : "POST";


            try {

                const resposta =
                    await fetch(
                        url,
                        {
                            method: metodo,

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(dados)
                        }
                    );


                if (!resposta.ok) {

                    let mensagemErro =
                        "Erro ao salvar a doação.";

                    try {

                        const erro =
                            await resposta.json();

                        const camposInvalidos =
                            Object.values(erro.fieldErrors || {});

                        if (camposInvalidos.length > 0) {
                            mensagemErro =
                                camposInvalidos.join(", ");
                        } else if (erro.message) {
                            mensagemErro =
                                erro.message;
                        }

                    } catch {
                        console.error(
                            "Não foi possível interpretar a resposta de erro."
                        );
                    }

                    mensagem.textContent =
                        mensagemErro;

                    return;
                }


                limparFormulario();

                await listarDoacoes();

            } catch (erro) {

                console.error(erro);

                mensagem.textContent =
                    "Não foi possível salvar a doação.";
            }
        }
    );


    botaoCancelar.addEventListener(
        "click",
        limparFormulario
    );


    window.addEventListener(
        "DOMContentLoaded",
        async () => {

            try {
                await carregarOpcoes();
            } catch (erro) {
                mensagem.textContent = erro.message;
            }

            await listarDoacoes();
        }
    );

</script>

</body>

</html>
